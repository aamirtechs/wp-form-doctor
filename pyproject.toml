[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-form-doctor"
version = "1.0.0"
description = "Audit a WordPress form submissions CSV export for spam patterns, link drops, too-fast submissions, duplicate submissions, and unanswered genuine leads"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
wp-form-doctor = "wp_form_doctor:main_entry"

[tool.setuptools]
py-modules = ["wp_form_doctor"]
